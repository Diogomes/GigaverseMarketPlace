app:
  orders:
    expiration-job-enabled: false
  shipping:
    zones:
      - { name: "Teste PE", from-postal-code: "50000000", to-postal-code: "56999999", price: 15.00, min-days: 2, max-days: 4 }
  cors:
    allowed-origins: http://localhost:5173
  storage:
    type: local
    local:
      root-dir: ${java.io.tmpdir}/gigaverse3d-test-storage
  auth:
    rate-limits:
      # limites altos por IP nos testes (todas as requisições vêm de 127.0.0.1); o teste de 429 usa IP próprio
      login-per-ip: 10000
      register-per-ip: 10000
      forgot-per-ip: 10000
      forgot-per-email: 10000
