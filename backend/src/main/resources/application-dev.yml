# Perfil de desenvolvimento local. Os valores padrão apontam para o docker-compose
# e NÃO são segredos: o banco local só escuta em 127.0.0.1.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gigaverse3d}
    username: ${DB_USERNAME:gigaverse3d}
    password: ${DB_PASSWORD:gigaverse3d_dev}
  # E-mails vão para o Mailpit local (http://localhost:8025) — nada sai para a internet.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  flyway:
    # Catálogo de demonstração apenas em desenvolvimento (nunca em prod/test).
    locations: classpath:db/migration,classpath:db/seed

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  shipping:
    # TABELA DE EXEMPLO (dev) — valores fictícios, exibidos como "valores de demonstração".
    demo-values: true
    zones:
      - { name: "Pernambuco", from-postal-code: "50000000", to-postal-code: "56999999", price: 15.00, min-days: 2, max-days: 4 }
      - { name: "Nordeste", from-postal-code: "40000000", to-postal-code: "65999999", price: 25.00, min-days: 4, max-days: 8 }
      - { name: "Demais regiões", from-postal-code: "00000000", to-postal-code: "99999999", price: 39.00, min-days: 6, max-days: 12 }
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
