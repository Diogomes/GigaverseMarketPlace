# Ambiente de DESENVOLVIMENTO. Não usar em produção (ver docs/ROADMAP.md, Fase 12).
# Portas publicadas apenas em 127.0.0.1 — não ficam acessíveis na rede local.
name: gigaverse3d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gigaverse3d}
      POSTGRES_USER: ${POSTGRES_USER:-gigaverse3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigaverse3d_dev}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
